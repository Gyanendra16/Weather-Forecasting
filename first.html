<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Weather forecast</title>

            <span class="material-symbols-outlined">
             search

                    </div>

            <div class="forecast-itemcontainer">
                <div class="forecat-item">
                    <h5 class="forecast-date reg-txt">06 March</h5>
                    <img src="pblphoto/thunderstorm.svg" class="forecat-item-img">
                    <h5 class="forecast=temp">29 °C</h5>
                </div>
                <div class="forecat-item">
                    <h5 class="forecast-date reg-txt">06 March</h5>
                    <img src="pblphoto/thunderstorm.svg" class="forecat-item-img">
                    <h5 class="forecast=temp">29 °C</h5>
                </div>
                <div class="forecat-item">
                    <h5 class="forecast-date reg-txt">06 March</h5>
                    <img src="pblphoto/thunderstorm.svg" class="forecat-item-img">
                    <h5 class="forecast=temp">29 °C</h5>
                </div>
                <div class="forecat-item">
                    <h5 class="forecast-date reg-txt">06 March</h5>
                    <img src="pblphoto/thunderstorm.svg" class="forecat-item-img">
                    <h5 class="forecast=temp">29 °C</h5>

        <section class="search-city section-message" >
            <div>
                <h1>search-city</h1>
                <img  src="pblphoto/search-city.png" >
                <h4 class="regular-text">
                    Find the weather condition of the city
                </h4>
            </div>
        </section>
        <section class="not-found section-message " style="display: none;">
            <div>
                <h1>search-city</h1>
                <img  src="pblphoto/not-found.png" >
                <h4 class="regular-text">
                    Find the weather condition of the city
                </h4>
            </div>
        </section>

</html>
